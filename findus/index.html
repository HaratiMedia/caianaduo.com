<style>

:root{
--bg:#0b0d10;
--bg2:#131720;
--text:#e6e7eb;
--muted:#aeb3bd;
--brand:#14c38e;
--brand2:#ffb703;
--card:rgba(255,255,255,0.06);
--border:rgba(255,255,255,0.12);
--shadow:0 10px 40px rgba(0,0,0,0.35);
--radius-lg:28px;
--radius-md:14px;
}

*{box-sizing:border-box}

body{
margin:0;
font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif;
color:var(--text);

background:
radial-gradient(1200px 800px at 15% -10%, #1b2a4a 0%, transparent 55%),
radial-gradient(1200px 800px at 110% 30%, #1a5537 0%, transparent 60%),
linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);

display:flex;
align-items:center;
justify-content:center;

min-height:100vh;
padding:28px;
}

.wrap{
width:100%;
max-width:720px;
}

.card{
background:var(--card);
backdrop-filter:blur(10px);
border:1px solid var(--border);
box-shadow:var(--shadow);
border-radius:var(--radius-lg);
padding:28px;
}

header{
text-align:center;
margin-bottom:18px;
}

.avatar{
width:108px;
height:108px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 14px;
border:2px solid rgba(255,255,255,0.25);
background:#111;
}

h1{
font-size:1.6rem;
margin:0 0 4px;
}

.tagline{
color:var(--muted);
font-size:0.98rem;
margin:0;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

.grid.cols-2{
margin-top:12px;
}

@media(min-width:560px){
.grid.cols-2{
grid-template-columns:1fr 1fr;
}
}

.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;

width:100%;
padding:14px 16px;

border-radius:var(--radius-md);
border:1px solid var(--border);

background:#0f131a;
color:#fff;

text-decoration:none;
font-weight:600;

box-shadow:var(--shadow);

transition:transform .08s ease, background .2s ease;

text-align:center;
}

.btn:hover{
transform:translateY(-1px);
}

.btn.brand{
background:linear-gradient(135deg,#10b981,var(--brand));
font-size:1.05rem;
padding:18px 16px;
}

.btn.ghost{
background:transparent;
color:var(--text);
}

.section-title{
margin:20px 0 10px;
font-size:0.9rem;
color:var(--muted);
text-transform:uppercase;
letter-spacing:0.12em;
text-align:center;
}

.socials{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-top:10px;
}

.icon-btn{
width:44px;
height:44px;

border-radius:12px;

display:inline-flex;
align-items:center;
justify-content:center;

border:1px solid var(--border);
background:rgba(255,255,255,0.04);

color:var(--text);
text-decoration:none;

transition:transform .08s ease, background .2s ease;
}

.icon-btn:hover{
transform:translateY(-1px);
background:rgba(255,255,255,0.08);
}

.icon-btn svg{
width:22px;
height:22px;
}

footer{
text-align:center;
margin-top:18px;
color:var(--muted);
font-size:0.9rem;
}

</style>
</head>
